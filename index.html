<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل التوجيه الطلابي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--t:#0e3a48;--t2:#17576b;--g:#1f9bb0;--g2:#64c6d4;--g3:#a8e0e8;--bg:#f2f8fa;--card:#fff;--line:#e0edf1;--ink:#14323b;--mut:#64848e;--ok:#1d8a62;--warn:#b5751a;--bad:#b23b3b;--sb:300px}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;overflow-x:hidden}
body:before{content:'';position:fixed;inset:0;background:radial-gradient(900px 500px at 90% -10%,#dff1f5 0%,transparent 60%),radial-gradient(700px 400px at -10% 110%,#e6f4f7 0%,transparent 60%);z-index:-1}
/* sidebar */
aside{position:fixed;inset-inline-start:0;top:0;bottom:0;width:var(--sb);background:linear-gradient(180deg,#0e3a48,#134c5e 55%,#17607a);color:#fff;padding:22px 16px;overflow-y:auto;z-index:50;transition:.3s}
aside .brand{display:flex;gap:12px;align-items:center;padding:0 6px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:16px}
aside .brand img{height:42px;background:#fff;border-radius:11px;padding:5px 7px}
aside .brand b{font-size:15.5px;font-weight:800;display:block;line-height:1.35}
aside .brand span{font-size:11.5px;opacity:.72}
.navgrp{font-size:11px;letter-spacing:.5px;opacity:.5;margin:16px 10px 7px;font-weight:700}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:13px;cursor:pointer;font-size:14.2px;font-weight:600;color:#d8ecf1;transition:.18s;margin-bottom:3px;border:1px solid transparent}
.nav:hover{background:rgba(255,255,255,.08);color:#fff}
.nav.on{background:#fff;color:var(--t);font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.nav .ic{width:22px;height:22px;flex:0 0 22px;opacity:.9}
.nav.on .ic{opacity:1}
.nav .badge{margin-inline-start:auto;background:rgba(255,255,255,.16);border-radius:999px;font-size:11.5px;padding:1px 9px;font-weight:700}
.nav.on .badge{background:var(--g);color:#fff}
aside .foot{margin-top:22px;padding:13px 12px;border-radius:14px;background:rgba(255,255,255,.07);font-size:11.8px;line-height:1.8;opacity:.85}
/* main */
main{margin-inline-start:var(--sb);padding:22px 26px 70px;min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap;position:sticky;top:0;z-index:40;background:rgba(242,248,250,.88);backdrop-filter:blur(10px);padding:12px 0;border-bottom:1px solid #e3eff2}
.gs{position:relative}
.gs input{font-family:inherit;font-size:13.5px;padding:9px 38px 9px 14px;border:1.6px solid var(--line);border-radius:12px;background:#fff;width:230px}
.gs input:focus{outline:none;border-color:var(--g);width:280px}
.gsres{position:absolute;inset-inline-start:0;top:46px;width:min(420px,88vw);background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(14,58,72,.16);max-height:62vh;overflow:auto;display:none;z-index:60}
.gsres.on{display:block}
.gsi{padding:10px 14px;border-bottom:1px solid #f0f6f8;cursor:pointer;font-size:13.4px}
.gsi:hover{background:#eef8fa}
.gsi b{color:var(--t)}.gsi span{color:var(--mut);font-size:12px}
.hero{background:linear-gradient(130deg,#0e3a48,#17576b 50%,#1f9bb0 150%);color:#fff;border-radius:26px;padding:26px 28px;margin-bottom:20px;display:flex;align-items:center;gap:22px;flex-wrap:wrap;position:relative;overflow:hidden;box-shadow:0 10px 34px rgba(14,58,72,.2)}
.hero:after{content:'';position:absolute;inset-inline-end:-60px;top:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero:before{content:'';position:absolute;inset-inline-end:60px;bottom:-110px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.05)}
.hero img{height:62px;background:#fff;border-radius:16px;padding:8px 12px}
.hero h2{font-size:26px;font-weight:900;letter-spacing:-.4px}
.hero p{opacity:.85;font-size:13.6px;margin-top:3px}
.hstats{margin-inline-start:auto;display:flex;gap:10px;flex-wrap:wrap;position:relative}
.hstat{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:10px 18px;text-align:center;min-width:92px}
.hstat b{display:block;font-size:21px;font-weight:800}
.hstat span{font-size:11.5px;opacity:.85}
.tl{position:relative;padding-inline-start:18px}
.tl:before{content:'';position:absolute;inset-inline-start:5px;top:6px;bottom:6px;width:2px;background:linear-gradient(var(--g2),#e4f2f5)}
.tli{position:relative;padding:9px 0}
.tli:after{content:'';position:absolute;inset-inline-start:-18px;top:16px;width:11px;height:11px;border-radius:50%;background:var(--g);border:2.5px solid #fff;box-shadow:0 0 0 2px var(--g3)}
.tli b{color:var(--t);font-size:14px}
.tli span{display:inline-block;background:#eaf6f8;color:var(--t2);border-radius:999px;padding:1px 10px;font-size:11.5px;font-weight:700;margin-inline-start:8px}
.tli p{color:var(--mut);font-size:13px}
.burger{display:none;background:var(--t);color:#fff;border:0;border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer}
.topbar h1{font-size:23px;font-weight:800;color:var(--t)}
.topbar p{font-size:13px;color:var(--mut)}
.topbar .right{margin-inline-start:auto;display:flex;gap:9px;align-items:center}
.btn{font-family:inherit;font-size:13.4px;font-weight:700;padding:9px 16px;border-radius:12px;border:1.6px solid var(--g);background:#fff;color:var(--g);cursor:pointer;transition:.18s;white-space:nowrap}
.btn:hover{background:var(--g);color:#fff;transform:translateY(-1px)}
.btn.fill{background:var(--t);border-color:var(--t);color:#fff}
.btn.fill:hover{background:var(--t2);border-color:var(--t2)}
.btn.sm{padding:6px 12px;font-size:12.5px;border-radius:10px}
/* cards */
.card{background:var(--card);border-radius:22px;padding:22px 24px;box-shadow:0 6px 26px rgba(14,58,72,.07);margin-bottom:20px;border:1px solid #edf5f7}
.card h2{font-size:19px;color:var(--t);font-weight:800;display:flex;align-items:center;gap:10px}
.card h2:before{content:'';width:7px;height:21px;background:linear-gradient(var(--g),var(--g2));border-radius:4px}
.card .sub{color:var(--mut);font-size:13.4px;margin:4px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(156px,1fr));gap:15px;margin-bottom:20px}
.kpi{background:#fff;border-radius:20px;padding:17px 19px;box-shadow:0 6px 22px rgba(14,58,72,.07);border:1px solid #edf5f7;position:relative;overflow:hidden;cursor:pointer;transition:.2s}
.kpi:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(14,58,72,.13)}
.kpi b{display:block;font-size:35px;font-weight:900;color:var(--t);line-height:1.1}
.kpi span{display:block;font-size:14px;font-weight:700;color:var(--t2)}
.kpi small{color:var(--mut);font-size:12px}
.kpi i{position:absolute;inset-inline-end:-22px;top:-22px;width:72px;height:72px;border-radius:50%;background:var(--g3);opacity:.45}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1.25fr .75fr}
.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
/* table */
.tools{display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.tools input.q{flex:1;min-width:180px;font-family:inherit;font-size:14px;padding:10px 15px;border:1.6px solid var(--line);border-radius:13px;background:#fafdfe}
.tools input.q:focus{outline:none;border-color:var(--g);background:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.fchip{border:1.5px solid var(--line);background:#fff;color:var(--t2);font-family:inherit;font-size:12.8px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.15s}
.fchip:hover{border-color:var(--g2)}
.fchip.on{background:var(--g);border-color:var(--g);color:#fff}
.tw{overflow:auto;border-radius:16px;border:1px solid var(--line);max-height:68vh}
table{width:100%;border-collapse:collapse;font-size:13.4px;background:#fff}
th{background:var(--t);color:#fff;font-weight:700;padding:12px 10px;text-align:right;font-size:12.8px;position:sticky;top:0;white-space:nowrap;cursor:pointer;user-select:none;z-index:2}
th:hover{background:var(--t2)}
th .ar{opacity:.45;font-size:10px}
td{padding:10px;border-top:1px solid #eef5f7;vertical-align:middle}
tbody tr{cursor:pointer;transition:.12s}
tbody tr:nth-child(even){background:#f8fcfd}
tbody tr:hover{background:#e9f7fa}
td.c{text-align:center;white-space:nowrap}
td.ltr{direction:ltr;text-align:center;font-family:Tahoma}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:#e7f4f7;color:#136173}
.chip.gr{background:#e6f6ee;color:var(--ok)}.chip.rd{background:#fdeaea;color:var(--bad)}
.chip.am{background:#fdf4e4;color:var(--warn)}.chip.bl{background:#e7f1fd;color:#2a5a9e}
.mini{font-size:11.5px;color:var(--mut)}
.note{background:#f1fafb;border-inline-start:4px solid var(--g);border-radius:12px;padding:12px 15px;font-size:13.4px;color:var(--t2);margin:12px 0}
.note.warn{background:#fdf5f5;border-color:var(--bad);color:#8e2f2f;font-weight:600}
/* charts */
.chart{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:86px 1fr 46px;align-items:center;gap:10px;font-size:13px}
.bar .tr{background:#eef6f8;border-radius:999px;height:14px;overflow:hidden}
.bar .fl{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--g),var(--g2));transition:width .9s cubic-bezier(.3,1,.4,1)}
.bar b{text-align:center;color:var(--t);font-weight:800}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.lg{display:flex;flex-direction:column;gap:7px;font-size:12.8px}
.lg div{display:flex;align-items:center;gap:8px}
.lg i{width:11px;height:11px;border-radius:4px;display:inline-block}
/* steps */
.step{display:flex;gap:13px;padding:12px 0;border-bottom:1px dashed #dfeef1}
.step:last-child{border:0}
.step .n{flex:0 0 46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--t),var(--t2));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.step h4{color:var(--t);font-size:15px}.step p{color:var(--mut);font-size:13.3px}
/* program */
.prog{border:1px solid var(--line);border-radius:20px;padding:20px;background:linear-gradient(170deg,#fff,#f7fcfd)}
.prog .tag{display:inline-block;background:var(--g);color:#fff;font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:999px}
.prog h3{color:var(--t);font-size:18px;margin:9px 0 5px}
.pbar{height:9px;background:#eaf4f6;border-radius:999px;overflow:hidden;margin:12px 0 6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g2));transition:width .5s}
.chk{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-top:1px solid #eef5f7}
.chk input{width:19px;height:19px;accent-color:var(--g);margin-top:3px;cursor:pointer;flex:0 0 19px}
.chk b{color:var(--t);font-size:13.8px}
.chk p{font-size:12.8px;color:var(--mut)}
.chk .meta{font-size:11.5px;color:var(--g);font-weight:700}
.chk.done b,.chk.done p{text-decoration:line-through;opacity:.55}
/* drawer + modal */
.ov{position:fixed;inset:0;background:rgba(10,40,50,.45);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:.25s;z-index:80}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(430px,92vw);background:#fff;z-index:90;transform:translateX(-100%);transition:.3s cubic-bezier(.3,1,.4,1);padding:24px;overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
html[dir=rtl] .drawer{transform:translateX(-100%)}
.drawer.on{transform:none!important}
.drawer h3{color:var(--t);font-size:20px;margin-bottom:3px;padding-inline-start:48px}
.drawer .sub0{padding-inline-start:48px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:12.3px;color:var(--mut);font-weight:700;margin-bottom:4px}
.fld .v{background:#f6fbfc;border:1px solid var(--line);border-radius:11px;padding:9px 12px;font-size:13.6px}
.fld input,.fld select,.fld textarea{width:100%;font-family:inherit;font-size:13.8px;padding:9px 12px;border:1.6px solid var(--line);border-radius:11px;background:#fff}
.fld textarea{min-height:88px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--g)}
.modal{position:fixed;inset-inline:0;top:50%;transform:translateY(-50%) scale(.96);margin:auto;width:min(560px,92vw);max-height:86vh;overflow:auto;background:#fff;border-radius:22px;padding:26px;z-index:95;opacity:0;pointer-events:none;transition:.25s}
.modal.on{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.rowbtn{display:flex;gap:9px;margin-top:16px}
.x{position:absolute;inset-inline-start:18px;top:16px;border:0;background:#eef6f8;color:var(--t);width:34px;height:34px;border-radius:11px;font-size:17px;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:30px;font-size:14px}
.toast{position:fixed;inset-block-end:24px;inset-inline-start:50%;transform:translateX(50%) translateY(80px);background:var(--t);color:#fff;padding:12px 22px;border-radius:14px;font-size:13.5px;font-weight:700;z-index:120;transition:.3s;opacity:0}
.toast.on{transform:translateX(50%);opacity:1}
@media(max-width:980px){.g2{grid-template-columns:1fr}}
@media(max-width:860px){
 aside{transform:translateX(100%)}aside.open{transform:none}
 main{margin-inline-start:0;padding:16px 14px 60px}
 .burger{display:block}.topbar h1{font-size:19px}
}
@media print{
 aside,.topbar .right,.burger,.tools,.ov,.drawer,.modal{display:none!important}
 main{margin:0;padding:0}.card{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid}
 .tw{max-height:none;overflow:visible}body:before{display:none}
}

/* ---------- views ---------- */
function statChip(v){
 if(/حُسم وأُحيلت/.test(v))return `<span class="chip rd">${v}</span>`;
 if(/أُحيلت/.test(v))return `<span class="chip rd">${v}</span>`;
 if(/حُسم/.test(v))return `<span class="chip am">${v}</span>`;
 if(/أنهت الرحلة/.test(v))return `<span class="chip gr">${v}</span>`;
 if(/لم تبدأ/.test(v))return `<span class="chip am">${v}</span>`;
 if(/المرحلة/.test(v))return `<span class="chip bl">${v}</span>`;
 if(/تحسن|منتظمة/.test(v))return `<span class="chip gr">${v}</span>`;
 return `<span class="chip">${v}</span>`;}
function cell(c,v){v=v===undefined?'':v;
 if(c.t==='chip')return `<span class="chip">${v}</span>`;
 if(c.t==='chip2')return `<span class="chip gr">${v}</span>`;
 if(c.t==='state')return statChip(v);
 if(c.t==='kind'){const m={'صحية':'rd','اجتماعية':'am','اقتصادية':'gr'};return `<span class="chip ${m[v]||''}">${v}</span>`}
 if(c.t==='warn')return v==='—'?'—':`<span class="chip am">${v}</span>`;
 return v;}

 return `<div class="kpis">

  <div class="kpi"><i></i><b>${toAr(fin)}</b><span>أنهت الرحلة</span><small>${toAr(Math.round(fin/R.length*100))}٪ من المسجلات</small></div>
  <div class="kpi"><i></i><b>${toAr(mid)}</b><span>في منتصف الرحلة</span><small>محطة أو أكثر</small></div>
  <div class="kpi"><i></i><b>${toAr(non)}</b><span>لم تبدأ</span><small>تحتاج تذكيراً</small></div></div>
 <div class="grid g2"><div class="card"><h2>المشاركة حسب الصف</h2><p class="sub">عدد المسجلات في كل صف</p>
  ${bars([['أول متوسط',g('أول')],['ثاني متوسط',g('ثاني')],['ثالث متوسط',g('ثالث')]],Math.max(g('أول'),g('ثاني'),g('ثالث')))}</div>
 <div class="card"><h2>من أنهت الرحلة</h2><p class="sub">حسب الصف</p>
  ${bars([['أول متوسط',gf('أول')],['ثاني متوسط',gf('ثاني')],['ثالث متوسط',gf('ثالث')]],Math.max(1,gf('أول'),gf('ثاني'),gf('ثالث')))}</div></div>`}
function tableView(tk){
 const T=D.tables[tk]; VS[tk]=VS[tk]||{q:'',f:'',sort:null,dir:1};
 const grades=[...new Set(D.tables[tk].rows.map(r=>(r.cls||'').split('/')[0]).filter(Boolean))];
 const chips = grades.length>1?`<div class="chips"><button class="fchip ${!VS[tk].f?'on':''}" data-f="">الكل</button>${
   grades.map(g=>`<button class="fchip ${VS[tk].f===g?'on':''}" data-f="${g}">${g}</button>`).join('')}</div>`:'';
 return `<div class="card">
  <h2>${T.title}</h2><p class="sub">${T.sub}</p>
  ${T.secret?'<div class="note warn">سري — لا يُطَّلع عليه إلا من له صلاحية، ولا يُشارك خارج إدارة المدرسة.</div>':''}
  <div class="tools">
   <input class="q" placeholder="ابحثي بالاسم أو أي كلمة…" value="${VS[tk].q}">
   ${chips}
   <button class="btn sm" data-a="add">+ إضافة</button>
   <button class="btn sm" data-a="csv">تصدير CSV</button>
   <span class="chip" id="cnt-${tk}"></span>
  </div>
  <div id="tb-${tk}"></div></div>`;}
function renderTable(tk){
 const T=D.tables[tk],v=VS[tk];let rows=rowsOf(tk);
 if(v.f)rows=rows.filter(r=>(r.cls||'').startsWith(v.f));
 if(v.q){const q=v.q.trim();rows=rows.filter(r=>T.cols.some(c=>String(r[c.k]||'').includes(q))||String(r.note||'').includes(q))}
 if(v.sort){const k=v.sort;rows.sort((a,b)=>String(a[k]||'').localeCompare(String(b[k]||''),'ar')*v.dir)}
 const head=`<tr><th style="width:46px">م</th>${T.cols.map(c=>`<th data-s="${c.k}">${c.l} <span class="ar">${v.sort===c.k?(v.dir>0?'▲':'▼'):'⇅'}</span></th>`).join('')}</tr>`;
 const body=rows.length?rows.map((r,i)=>`<tr data-id="${r._id}">
   <td class="c">${toAr(i+1)}${r._new?' <span class="mini">جديد</span>':''}</td>
   ${T.cols.map(c=>`<td class="${c.c}${c.t==='ltr'?' ltr':''}">${cell(c,r[c.k])}</td>`).join('')}</tr>`).join('')
   :`<tr><td colspan="${T.cols.length+1}"><div class="empty">لا توجد نتائج مطابقة</div></td></tr>`;
 $('#tb-'+tk).innerHTML=`<div class="tw"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
 $('#cnt-'+tk).textContent=toAr(rows.length)+' سجل';
 $$('#tb-'+tk+' th[data-s]').forEach(th=>th.onclick=()=>{const k=th.dataset.s;v.dir=(v.sort===k)?-v.dir:1;v.sort=k;renderTable(tk)});
 $$('#tb-'+tk+' tbody tr[data-id]').forEach(tr=>tr.onclick=()=>openRow(tk,tr.dataset.id));}
function wireTable(tk){
 const v=VS[tk];
 const q=$('.card .tools input.q');
 $$('.card .tools input.q').forEach(i=>i.oninput=e=>{v.q=e.target.value;renderTable(tk)});
 $$('.card .tools .fchip').forEach(b=>b.onclick=()=>{v.f=b.dataset.f;$$('.card .tools .fchip').forEach(x=>x.classList.toggle('on',x===b));renderTable(tk)});
 $$('.card .tools [data-a=add]').forEach(b=>b.onclick=()=>addRow(tk));
 $$('.card .tools [data-a=csv]').forEach(b=>b.onclick=()=>csv(tk));}
function openRow(tk,id){
 const T=D.tables[tk],r=rowsOf(tk).find(x=>x._id===id);if(!r)return;
 $('#dr').innerHTML=`<button class="x" onclick="closeAll()">✕</button>
  <h3>${r.name}</h3><p class="sub0" style="color:var(--mut);font-size:13px;margin-bottom:16px">${T.title}</p>
  ${T.cols.filter(c=>c.k!=='name'&&c.k!=='result').map(c=>`<div class="fld"><label>${c.l}</label><div class="v">${cell(c,r[c.k])||'—'}</div></div>`).join('')}
  <div class="fld"><label>النتيجة / الحالة</label><input id="d-res" value="${(r.result||'').replace(/"/g,'&quot;')}"></div>
  <div class="fld"><label>ملاحظة المتابعة</label><textarea id="d-note" placeholder="اكتبي ما تم مع الطالبة…">${r.note||''}</textarea></div>
  <div class="rowbtn"><button class="btn fill" onclick="saveRow('${tk}','${id}')">حفظ</button>
  ${r._new?`<button class="btn" style="border-color:var(--bad);color:var(--bad)" onclick="delRow('${tk}','${id}')">حذف</button>`:''}
  <button class="btn" onclick="closeAll()">إغلاق</button></div>`;
 $('#dr').classList.add('on');$('#ov').classList.add('on');}
function saveRow(tk,id){const e=ST.edits[id]||{};e.result=$('#d-res').value;e.note=$('#d-note').value;ST.edits[id]=e;save();closeAll();renderTable(tk);toast('تم الحفظ')}
function delRow(tk,id){const i=+id.split('|add')[1];ST.added[tk].splice(i,1);save();closeAll();go('t:'+tk);toast('تم الحذف')}
function addRow(tk){const T=D.tables[tk];
 $('#md').innerHTML=`<button class="x" onclick="closeAll()">✕</button><h3 style="color:var(--t);margin-bottom:14px">إضافة سجل — ${T.title}</h3>
 ${T.cols.map(c=>`<div class="fld"><label>${c.l}</label><input data-k="${c.k}"></div>`).join('')}
 <div class="rowbtn"><button class="btn fill" onclick="commitAdd('${tk}')">إضافة</button><button class="btn" onclick="closeAll()">إلغاء</button></div>`;
 $('#md').classList.add('on');$('#ov').classList.add('on');}
function commitAdd(tk){const o={};$$('#md [data-k]').forEach(i=>o[i.dataset.k]=i.value);
 if(!o.name){toast('اكتبي اسم الطالبة');return}
 ST.added[tk]=ST.added[tk]||[];ST.added[tk].push(o);save();closeAll();go('t:'+tk);toast('أُضيف السجل')}
function csv(tk){const T=D.tables[tk],rows=rowsOf(tk);
 const head=['م',...T.cols.map(c=>c.l),'ملاحظة المتابعة'];
 const lines=[head.join(','),...rows.map((r,i)=>[i+1,...T.cols.map(c=>`"${String(r[c.k]||'').replace(/"/g,'""')}"`),`"${(r.note||'')}"`].join(','))];
 const b=new Blob(["﻿"+lines.join("\n")],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=T.title+'.csv';a.click();toast('تم التصدير')}
function closeAll(){$('#dr').classList.remove('on');$('#md').classList.remove('on');$('#ov').classList.remove('on')}

function bars(items,max){return `<div class="chart">${items.map(([l,v])=>
 `<div class="bar"><span>${l}</span><div class="tr"><i class="fl" style="width:${Math.round(v/max*100)}%"></i></div><b>${toAr(v)}</b></div>`).join('')}</div>`}
function donut(parts){const tot=parts.reduce((a,b)=>a+b[1],0)||1;let off=0;const C=2*Math.PI*52;
 const segs=parts.map(([l,v,c])=>{const len=v/tot*C;const s=`<circle r="52" cx="70" cy="70" fill="none" stroke="${c}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=len;return s}).join('');
 return `<div class="donut"><svg width="140" height="140" viewBox="0 0 140 140">${segs}<circle r="36" cx="70" cy="70" fill="#fff"/>
 <text x="70" y="66" text-anchor="middle" font-size="24" font-weight="800" fill="#0e3a48" font-family="Tajawal">${toAr(tot)}</text>
 <text x="70" y="86" text-anchor="middle" font-size="11" fill="#64848e" font-family="Tajawal">سجل</text></svg>
 <div class="lg">${parts.map(([l,v,c])=>`<div><i style="background:${c}"></i>${l} <b style="color:#0e3a48">${toAr(v)}</b></div>`).join('')}</div></div>`}

function progsView(){
 return D.programs.map(p=>{const ck=ST.checks[p.key]||[];const done=p.steps.filter((_,i)=>ck[i]).length;
  return `<div class="card"><span class="tag" style="background:var(--g);color:#fff;font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:999px">${p.tag}</span>
  <h2 style="margin-top:10px">${p.name}</h2><p class="sub">${p.goal}</p>
  <div class="pbar"><i style="width:${Math.round(done/p.steps.length*100)}%"></i></div>
  <div class="mini">أُنجز ${toAr(done)} من ${toAr(p.steps.length)} إجراءات — ${toAr(Math.round(done/p.steps.length*100))}٪</div>
  ${p.steps.map((s,i)=>`<label class="chk ${ck[i]?'done':''}"><input type="checkbox" ${ck[i]?'checked':''} data-p="${p.key}" data-i="${i}">
   <div><b>${s[0]}</b><p>${s[1]}</p><span class="meta">${s[2]} · الشاهد: ${s[3]}</span></div></label>`).join('')}
  <div class="note"><b>مؤشر التحقق:</b> ${p.ind}</div>
  ${p.key==='rifq'&&D.tables.rifqj?`<button class="btn" onclick="go('t:rifqj')">عرض مشاركة الطالبات في رحلة رفق (${toAr(rowsOf('rifqj').length)} طالبة)</button>`:''}</div>`}).join('')}
function wireProgs(){$$('[data-p]').forEach(c=>c.onchange=()=>{const k=c.dataset.p,i=+c.dataset.i;
 ST.checks[k]=ST.checks[k]||[];ST.checks[k][i]=c.checked;save();go('progs');toast(c.checked?'تم التحقق':'أُلغي التحقق')})}
function planView(){return `<div class="card"><h2>الخطة السنوية لبرامج التوجيه الطلابي</h2><p class="sub">١٣ برنامجاً — العام الدراسي ١٤٤٨هـ</p>
 <div class="tw"><table><thead><tr><th style="width:46px">م</th><th>البرنامج</th><th>الفئة المستهدفة</th><th>فترة التنفيذ</th><th>مؤشر التحقق</th></tr></thead><tbody>
 ${D.progs.map((r,i)=>`<tr><td class="c">${toAr(i+1)}</td><td><b>${r[0]}</b></td><td>${r[1]}</td><td class="c">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}
 </tbody></table></div></div>`}
function irshadView(){return `<div class="card"><h2>جلسات الإرشاد الجمعي المنفذة</h2><p class="sub">الفصل الدراسي الأول ١٤٤٨هـ</p>
 <div class="tw"><table><thead><tr><th>الجلسة</th><th>المستفيدات</th><th>التاريخ</th><th>ملاحظات</th></tr></thead><tbody>
 ${D.jalsat.map(r=>`<tr><td><b>${r[0]}</b></td><td class="c"><span class="chip">${r[1]}</span></td><td class="c">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}
 </tbody></table></div></div>
 <div class="card"><h2>بناء الجلسة</h2><p class="sub">٤٠ دقيقة — تُطبَّق على أي ظاهرة سلبية</p>
 ${D.session.map(s=>`<div class="step"><div class="n">${s[0]}</div><div><h4>${s[1]}</h4><p>${s[2]}</p></div></div>`).join('')}</div>
 <div class="card"><h2>إجراءات الموجهة الطلابية</h2><p class="sub">التدرج في الغياب والتأخر وفق قواعد السلوك والمواظبة</p>
 <div class="tw"><table><thead><tr><th style="width:170px">المرحلة</th><th>الإجراء</th></tr></thead><tbody>
 ${D.ijraat.map(r=>`<tr><td class="c"><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>
 <div class="note">الرصد والحسم وإصدار الإنذارات من مسؤولية إدارة المدرسة، ودور الموجهة الطلابية الدراسة والإرشاد والمتابعة والتوثيق.</div></div>`}
function usraView(){return `<div class="card"><h2>إطار توثيق العلاقة بين الأسرة والمدرسة</h2><p class="sub">الهدف العام: توثيق العلاقة بما يحقق التوافق النفسي والتربوي للطالبة</p>
 <div class="grid g3">${[['لجنة التوجيه الطلابي','١٩ إجراءً','قنوات التواصل، وقاعدة بيانات أولياء الأمور، والمجالس، ومتابعة التسرب والغياب، وحصر خبرات أولياء الأمور.'],
 ['المعلمات','٤ إجراءات','مهارات الاستذكار، والمشاركة في خطط التدخل التربوي، والتكامل مع الموجهة الطلابية، والمشاركة في المجالس.'],
 ['الموجهة الطلابية','١٤ إجراءً','برامج التوجيه، وتنمية الدافعية، والتوجيه المهني، والاستخدام الآمن، وخصائص النمو، والتقارير الدورية.']]
 .map(s=>`<div class="prog"><span class="tag">${s[1]}</span><h3>${s[0]}</h3><p style="font-size:13.4px;color:var(--mut)">${s[2]}</p></div>`).join('')}</div>
 <p class="sub" style="margin-top:18px"><b>آلية التنفيذ</b></p>
 <div class="chips">${['ندوات','رسائل نصية','لقاءات فردية','نشرات','ورش عمل','منصة مدرستي','مسابقات','مجالس الأمهات','القنوات الرسمية','زيارات منزلية عند الحاجة'].map(x=>`<span class="fchip">${x}</span>`).join('')}</div></div>`}
const TITLES={home:['لوحة المؤشرات','نظرة عامة على أعمال التوجيه الطلابي'],progs:['البرامج التفصيلية','رفق والاستخدام الآمن — تابعي تنفيذ كل إجراء'],
 plan:['الخطة السنوية','برامج التوجيه الطلابي ١٤٤٨هـ'],irshad:['الإرشاد الجمعي','الجلسات والبناء والإجراءات'],
usra:['الأسرة والمدرسة','خطة توثيق العلاقة']};
function go(k){
 setActive(k);$('#sb').classList.remove('open');
 let html='',t=TITLES[k];
 if(k.startsWith('t:')){const tk=k.slice(2);html=(tk==='rifqj'?rifqStats():'')+tableView(tk);t=[D.tables[tk].title,D.tables[tk].sub];}
 else if(k==='home')html=home(); else if(k==='progs')html=progsView(); else if(k==='plan')html=planView();
 else if(k==='irshad')html=irshadView(); else if(k==='usra')html=usraView();
 $('#view').innerHTML=html;$('#ttl').textContent=t?t[0]:'';$('#tsub').textContent=t?t[1]:'';
 if(k.startsWith('t:')){const tk=k.slice(2);renderTable(tk);wireTable(tk);}
 if(k==='progs')wireProgs();
 window.scrollTo({top:0,behavior:'smooth'});}
function resetAll(){if(!confirm('سيتم مسح كل التعديلات والإضافات والعودة للبيانات الأصلية. متأكدة؟'))return;
 ST={edits:{},added:{},checks:{}};save();go('home');toast('تمت الاستعادة')}
function searchAll(q){const out=[];if(q.trim().length<2)return out;
 Object.keys(D.tables).forEach(tk=>{rowsOf(tk).forEach(r=>{
  if(Object.values(r).some(v=>String(v).includes(q))) out.push({tk,name:r.name,cls:r.cls||r.frm||'',id:r._id,t:D.tables[tk].title});});});
 return out.slice(0,40);}
const gq=$('#gq'),gres=$('#gres');
gq.oninput=()=>{const res=searchAll(gq.value);
 if(!res.length){gres.classList.remove('on');return}
 gres.innerHTML=res.map(r=>`<div class="gsi" data-tk="${r.tk}" data-id="${r.id}"><b>${r.name}</b> <span>${r.cls}</span><br><span>${r.t}</span></div>`).join('');
 gres.classList.add('on');
 $$('.gsi',gres).forEach(i=>i.onclick=()=>{gres.classList.remove('on');gq.value='';go('t:'+i.dataset.tk);setTimeout(()=>openRow(i.dataset.tk,i.dataset.id),250)});};
document.addEventListener('click',e=>{if(!e.target.closest('.gs'))gres.classList.remove('on')});
buildNav();go('home');
</script></body></html>
